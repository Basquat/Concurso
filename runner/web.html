<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com blob:; style-src 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src * data: blob:; font-src * data:; connect-src https:; media-src * data: blob:; worker-src blob:">
<title>Pré-visualização</title>
<!-- Executor isolado do Code Studio: roda no iframe com sandbox (origem opaca, sem acesso aos dados do Concurso Lab). -->
<script>
addEventListener('message', function (e) {
  if (!e.data || e.data.tipo !== 'carregar') return;
  document.open();
  document.write(e.data.html);
  document.close();
});
parent.postMessage({ tipo: 'runner-pronto' }, '*');
</script>
</head>
<body></body>
</html>
